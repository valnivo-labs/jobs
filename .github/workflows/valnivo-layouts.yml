# Valnivo: statement layouts people chose to send. Publishes, on the `published` branch, the taught layouts
# that at least three submissions agree on and whose headings hold nothing outside valnivo/vocabulary.json;
# deletes submissions after 90 days and daily counts once the day is over. Valnivo takes the published
# list into the app by hand (`npm run layouts:import` there), so nothing here reaches the app unreviewed.
#
# Same guards as every job here: schedule and Run workflow only, the repository's name on every job, and
# credentials for this repository's main branch alone. The log is public; the script prints counts only.
name: Valnivo · statement layouts

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: valnivo-layouts
  cancel-in-progress: false

jobs:
  read:
    if: github.repository == 'valnivo-labs/jobs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Sign in to Google Cloud without a stored key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/781367582475/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: jobs-runner@ledgger-3950a.iam.gserviceaccount.com
      - name: Start from what is already published
        run: |
          if git fetch --depth=1 origin published 2>/dev/null; then
            git show origin/published:valnivo/layouts.json > valnivo/layouts.json
          fi
      - name: Read, publish what agrees, delete what expired
        run: node valnivo/layouts-job.mjs valnivo/layouts.json valnivo/vocabulary.json
        env:
          VALNIVO_KEYLESS: '1'
          FIREBASE_PROJECT: ledgger-3950a
      - name: Publish the list when it changed
        run: |
          cp valnivo/layouts.json "$RUNNER_TEMP/layouts.json"
          git config user.name 'Valnivo Labs'
          git config user.email 'support@valnivo.eu'
          if git fetch --depth=1 origin published 2>/dev/null; then
            git switch -c published FETCH_HEAD
          else
            git switch --orphan published
            git rm -rq --cached . 2>/dev/null || true
          fi
          mkdir -p valnivo
          cp "$RUNNER_TEMP/layouts.json" valnivo/layouts.json
          git add valnivo/layouts.json
          if git diff --cached --quiet; then
            echo "layouts: nothing new to publish"
          else
            git commit -qm "Valnivo: statement layouts, $(date -u +%F)"
            git push -q origin published
          fi
