# Valnivo: due push reminders, space and loan notices, and the expired-share sweep, during European waking
# hours. The script is valnivo/send-reminders.mjs, edited in Valnivo's own repository and copied here.
#
# Only Valnivo Labs can start it: no trigger a stranger can fire (schedule, and Run workflow, which needs
# write access), every job guarded by the repository's name so a fork runs nothing, and Google Cloud gives
# credentials only to this repository's main branch. The log is public, so the script prints counts only.
name: Valnivo · reminders

on:
  schedule:
    - cron: '7 5-22 * * *' # 05:07–22:07 UTC = 07:07–00:07 Luxembourg summer time
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: valnivo-reminders
  cancel-in-progress: false

jobs:
  send:
    if: github.repository == 'valnivo-labs/jobs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Sign in to Google Cloud without a stored key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/781367582475/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: jobs-runner@ledgger-3950a.iam.gserviceaccount.com
      - name: Send what is due
        run: node valnivo/send-reminders.mjs
        env:
          VALNIVO_KEYLESS: '1'
          FIREBASE_PROJECT: ledgger-3950a
